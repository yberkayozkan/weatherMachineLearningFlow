name: Train LSTM Historical Forecast Weather Model

on:
  workflow_dispatch:
    inputs:
      sequence_length:
        description: "Hourly sequence length"
        required: false
        default: "24"
      hidden_size:
        description: "LSTM hidden size"
        required: false
        default: "64"
      num_layers:
        description: "LSTM layer count"
        required: false
        default: "1"
      epochs:
        description: "Training epochs"
        required: false
        default: "12"
      batch_size:
        description: "Batch size"
        required: false
        default: "256"
      learning_rate:
        description: "Learning rate"
        required: false
        default: "0.001"
      test_fraction:
        description: "Latest-period final holdout fraction"
        required: false
        default: "0.2"
      max_rows:
        description: "Optional latest eligible row limit; blank means full 2021+ range"
        required: false
        default: ""
      acceptance_threshold:
        description: "Minimum f1_macro for accepted tag"
        required: false
        default: "0.40"
  workflow_run:
    workflows: ["OpenMeteo Supabase Pipeline"]
    types: [completed]

concurrency:
  group: weather-lstm-training
  cancel-in-progress: false

jobs:
  train:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_FEATURE_TABLE: ${{ vars.SUPABASE_FEATURE_TABLE || 'KadikoyWeatherCodeFeature' }}
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      TRAIN_SEQUENCE_LENGTH: ${{ github.event.inputs.sequence_length || '24' }}
      TRAIN_HIDDEN_SIZE: ${{ github.event.inputs.hidden_size || '64' }}
      TRAIN_NUM_LAYERS: ${{ github.event.inputs.num_layers || '1' }}
      TRAIN_EPOCHS: ${{ github.event.inputs.epochs || '12' }}
      TRAIN_BATCH_SIZE: ${{ github.event.inputs.batch_size || '256' }}
      TRAIN_LEARNING_RATE: ${{ github.event.inputs.learning_rate || '0.001' }}
      TRAIN_TEST_FRACTION: ${{ github.event.inputs.test_fraction || '0.2' }}
      TRAIN_MAX_ROWS: ${{ github.event.inputs.max_rows || '' }}
      TRAIN_ACCEPTANCE_THRESHOLD: ${{ github.event.inputs.acceptance_threshold || '0.40' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Train LSTM model from Supabase
        shell: bash
        run: |
          args=(
            --table-name "$SUPABASE_FEATURE_TABLE"
            --output-dir artifacts/lstm-training
            --sequence-length "$TRAIN_SEQUENCE_LENGTH"
            --hidden-size "$TRAIN_HIDDEN_SIZE"
            --num-layers "$TRAIN_NUM_LAYERS"
            --epochs "$TRAIN_EPOCHS"
            --batch-size "$TRAIN_BATCH_SIZE"
            --learning-rate "$TRAIN_LEARNING_RATE"
            --test-fraction "$TRAIN_TEST_FRACTION"
            --acceptance-threshold "$TRAIN_ACCEPTANCE_THRESHOLD"
          )
          if [ -n "$TRAIN_MAX_ROWS" ]; then
            args+=(--max-rows "$TRAIN_MAX_ROWS")
          fi
          python -m weather_ml.pipelines.train_lstm_from_supabase "${args[@]}"

      - name: Upload LSTM training artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weather-lstm-training-artifacts
          path: artifacts/lstm-training
