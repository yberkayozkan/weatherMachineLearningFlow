[project]
name = "weather-machine-learning"
version = "0.1.0"
description = "Weather data ingestion, feature engineering, and Supabase loading pipeline."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0",
    "openmeteo-requests>=1.3.0",
    "pandas>=2.2.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "requests-cache>=1.2.0",
    "retry-requests>=2.0.0",
    "joblib>=1.4.0",
    "matplotlib>=3.8.0",
    "mlflow>=2.14.0",
    "scikit-learn>=1.5.0",
    "SQLAlchemy>=2.0.30",
    "supabase>=2.10.0",
    "xgboost>=2.1.0",
    "lightgbm>=4.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
